<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060d14">
<title>Journey → Vector</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="A fly's outbound flight is folded into one stored vector, flipped to point home, flown back, and reset at the banana"></canvas>
  <div id="vignette"></div>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="callouts" aria-hidden="true"></div>


  
  <section id="editorial">
    <div class="eyebrow"><span id="chapter-no">01</span><span id="chapter-name">THE JOURNEY BECOMES MEMORY</span></div>
    <h1 id="headline"></h1>
  </section>

  <footer>
    <div class="transport">
      <button id="play" aria-label="Pause">Ⅱ</button>
      <button id="restart" aria-label="Restart">↺</button>
      <span id="time">00.0 <em>/ 20.0</em></span>
      <span class="hint">SPACE PAUSE · ← → STEP · DRAG TO SCRUB</span>
    </div>
    <input id="timeline" type="range" min="0" max="20" step="0.01" value="0" aria-label="Time">
    <nav>
      <button data-time="0"><b>01</b> Journey → memory<span>9.0s</span></button>
      <button data-time="9"><b>02</b> Reverse it to get home<span>8.0s</span></button>
      <button data-time="16.8"><b>03</b> Home, and reset<span>3.5s</span></button>
    </nav>
  </footer>
  <aside id="brainpanel" aria-label="Circuit panel">
    <div class="bp-eyebrow">THE CIRCUIT</div>
    <canvas id="brain"></canvas>
  </aside>
  <div id="error" hidden></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
