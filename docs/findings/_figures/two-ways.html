<figure>

      <text x="20" y="22" font-weight="700">A · activity integrator</text>

      <text x="20" y="200" font-size="12" fill="#5a5f6a">Memory = firing pattern. Needs strong, structured self-connections.</text>
      <text x="440" y="16" font-weight="700">B · synaptic integrator</text>

      <g stroke="#b4432c" stroke-width="2"><line x1="560" y1="50" x2="648" y2="50"/><line x1="560" y1="62" x2="648" y2="62" stroke-width="5"/><line x1="560" y1="74" x2="648" y2="74" stroke-width="3"/></g>
