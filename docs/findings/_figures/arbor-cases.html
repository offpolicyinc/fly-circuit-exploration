<figure>
    <svg viewBox="0 0 820 322" width="100%" role="img" aria-label="Contact on dendrite versus axonal arbor">
      <defs><marker id="h" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#1b1b1f"/></marker><marker id="i" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#b4432c"/></marker></defs>
      <!-- case A: dendritic contact -->
      <text x="20" y="22" font-weight="700">Case A · hΔB axon lands on the store's dendrite → inverted</text>
      <rect x="20" y="40" width="380" height="90" rx="6" fill="#f5f4ef" stroke="#e3e2dc"/>
      <text x="60" y="60" font-size="11" fill="#5a5f6a">column T (travel dir.)</text><text x="300" y="60" font-size="11" fill="#5a5f6a">column T + 180°</text>
      <rect x="40" y="82" width="62" height="26" rx="6" fill="#2a6f97"/><text x="71" y="99" text-anchor="middle" fill="#fff" font-size="11">hΔB out</text>
      <line x1="102" y1="95" x2="118" y2="95" stroke="#1b1b1f" stroke-width="2" marker-end="url(#h)"/>
      <rect x="120" y="82" width="62" height="26" rx="6" fill="#f6e7e3" stroke="#b4432c" stroke-width="2"/><text x="151" y="99" text-anchor="middle" font-size="11">store in</text>
      <path d="M182 95 L 300 95" stroke="#1b1b1f" stroke-width="2" fill="none" marker-end="url(#h)"/>
      <rect x="302" y="82" width="70" height="26" rx="6" fill="#b4432c"/><text x="337" y="99" text-anchor="middle" fill="#fff" font-size="11">store out</text>
      <text x="210" y="150" text-anchor="middle" font-size="12">store outputs at T + 180°: <tspan font-weight="700">−T</tspan> reaches the goal layer</text>
      <!-- case B: axonal contact -->
      <text x="20" y="182" font-weight="700">Case B · hΔB axon lands on the store's axonal arbor → not inverted</text>
      <rect x="20" y="200" width="380" height="90" rx="6" fill="#f5f4ef" stroke="#e3e2dc"/>
      <text x="50" y="220" font-size="11" fill="#5a5f6a">column T − 180°</text><text x="260" y="220" font-size="11" fill="#5a5f6a">column T (travel dir.)</text>
      <rect x="40" y="242" width="62" height="26" rx="6" fill="#f6e7e3" stroke="#b4432c" stroke-width="2"/><text x="71" y="259" text-anchor="middle" font-size="11">store in</text>
      <path d="M102 255 L 228 255" stroke="#1b1b1f" stroke-width="2" fill="none" marker-end="url(#h)"/>
      <rect x="230" y="242" width="62" height="26" rx="6" fill="#2a6f97"/><text x="261" y="259" text-anchor="middle" fill="#fff" font-size="11">hΔB out</text>
      <line x1="292" y1="255" x2="308" y2="255" stroke="#1b1b1f" stroke-width="2" marker-end="url(#h)"/>
      <rect x="310" y="242" width="70" height="26" rx="6" fill="#b4432c"/><text x="345" y="259" text-anchor="middle" fill="#fff" font-size="11">store out</text>
      <text x="210" y="310" text-anchor="middle" font-size="12">contact and output share column T: <tspan font-weight="700">+T</tspan> reaches the goal layer</text>
      <!-- right: measured -->
      <text x="440" y="22" font-weight="700">Measured (MaleCNS, replicated in hemibrain)</text>
      <g font-size="13">
        <text x="440" y="52">hΔA: 92 % of hΔB input on its axonal arbor → case B</text>
        <text x="440" y="74">hΔH: 95 % → case B</text>
        <text x="440" y="96">hΔI: 82 % → case B</text>
        <text x="440" y="118">hΔG: 73 % → case B</text>
        <text x="440" y="140">hΔJ: 58 % / 42 % → both, net weak</text>
        <text x="440" y="162">hΔK: 99 % on dendrite → case A (inverts)</text>
        <text x="440" y="200" fill="#b4432c" font-weight="700">All four store candidates are case B.</text>
        <text x="440" y="220" fill="#b4432c" font-weight="700">They relay the displacement; they do not flip it.</text>
        <text x="440" y="252" fill="#5a5f6a" font-size="12">Hulse 2021 (Fig. 37Biii) noted this two-band motif</text>
        <text x="440" y="268" fill="#5a5f6a" font-size="12">anatomically; its sign consequence was not drawn.</text>
      </g>
    </svg>
    <figcaption>Same cell, opposite outcome, depending on which arbor hΔB reaches. Right: the measured share of hΔB synapses on each candidate's axon.</figcaption>
  </figure>
